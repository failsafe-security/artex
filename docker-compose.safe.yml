name: failsafe-artex

services:
  postgres:
    image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-artex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.safe}
      POSTGRES_DB: ${POSTGRES_DB:-artex}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  artex:
    build:
      context: .
      dockerfile: Dockerfile.safe
    image: failsafe-security/artex:v0.3.30-failsafe.2
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.safe
    environment:
      ARTEX_PG_DSN: postgres://${POSTGRES_USER:-artex}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-artex}?sslmode=disable
      NORMA_RIPGREP_NO_INSTALL: "1"
    ports:
      # Console and API. Localhost only by default.
      - "127.0.0.1:8787:8787"
      # Recording proxy, unlocked for traffic inspection.
      - "127.0.0.1:8788:8788"
    volumes:
      - artex_data:/app/data
      # JWT signing key. Persisted separately so sessions survive restarts and
      # the key stays out of the browsable data directory.
      - artex_key:/app/keys
      # Optional: review and mount local skills read-only.
      # - ./skills:/app/skills:ro
    restart: unless-stopped
    stop_grace_period: 30s
    # Offsec-max: root inside, extra caps for raw/AD/scapy work, no setuid
    # restrictions, and raised fd/proc limits so mass scanners do not starve.
    security_opt:
      - seccomp:unconfined
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_PTRACE
      - SYS_ADMIN
    ulimits:
      nofile: 65536
      nproc: 32768
    mem_limit: 8g
    pids_limit: 8192
    # Chromium needs more than Docker's default 64 MB /dev/shm.
    shm_size: "1gb"
    tmpfs:
      - /tmp:size=1g,mode=1777
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8787/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
  artex_data:
  artex_key: